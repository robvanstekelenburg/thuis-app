name: Afval-sync
on:
  schedule:
    - cron: '41 3 * * 1'   # elke maandag
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync afvalkalender
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HOUSEHOLD_ID: ${{ vars.HOUSEHOLD_ID }}
        run: node scripts/sync-waste.mjs
