name: Deploy PWA
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/sb-key.sh', '.github/workflows/deploy.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Schrijf config.js
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          URL=""; KEY=""
          if [ -n "$SUPABASE_PROJECT_REF" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            URL="https://$SUPABASE_PROJECT_REF.supabase.co"
            KEY=$(scripts/sb-key.sh publishable)
          else
            echo "::warning::Supabase nog niet gekoppeld; de app toont een setup-melding (zie README)."
          fi
          printf "export const SUPABASE_URL = '%s';\nexport const SUPABASE_KEY = '%s';\nexport const VAPID_PUBLIC_KEY = '%s';\n" \
            "$URL" "$KEY" "$VAPID_PUBLIC_KEY" > app/config.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v5
